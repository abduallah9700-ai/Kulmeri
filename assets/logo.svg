<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <!-- Kulmeri Academic Crest & Typography (Dark Palette for Light Backgrounds) -->
  <g transform="translate(15, 10)">
    <!-- Laurel Wreath Leaves (Left) -->
    <g fill="#A67038" opacity="0.85">
      <path d="M 28 32 C 24 25, 20 28, 22 36 C 24 38, 26 36, 28 32 Z"/>
      <path d="M 22 45 C 16 38, 14 43, 17 50 C 20 52, 22 49, 22 45 Z"/>
      <path d="M 19 60 C 13 55, 11 62, 16 68 C 19 70, 20 66, 19 60 Z"/>
      <path d="M 21 76 C 17 72, 14 80, 21 86 C 24 87, 24 82, 21 76 Z"/>
      <path d="M 28 92 C 25 89, 23 98, 31 101 C 33 100, 32 95, 28 92 Z"/>
      <path d="M 40 103 C 38 102, 38 110, 48 111 C 49 109, 46 105, 40 103 Z"/>
    </g>

    <!-- Laurel Wreath Leaves (Right) -->
    <g fill="#A67038" opacity="0.85">
      <path d="M 82 32 C 86 25, 90 28, 88 36 C 86 38, 84 36, 82 32 Z"/>
      <path d="M 88 45 C 94 38, 96 43, 93 50 C 90 52, 88 49, 88 45 Z"/>
      <path d="M 91 60 C 97 55, 99 62, 94 68 C 91 70, 90 66, 91 60 Z"/>
      <path d="M 89 76 C 93 72, 96 80, 89 86 C 86 87, 86 82, 89 76 Z"/>
      <path d="M 82 92 C 85 89, 87 98, 79 101 C 77 100, 78 95, 82 92 Z"/>
      <path d="M 70 103 C 72 102, 72 110, 62 111 C 61 109, 64 105, 70 103 Z"/>
    </g>

    <!-- Ornate Shield / Crest Contour -->
    <path d="M 55 18 L 82 28 C 82 58, 75 88, 55 102 C 35 88, 28 58, 28 28 Z" 
          fill="#FAF6F0" stroke="#8C531B" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Shield Inset -->
    <path d="M 55 24 L 76 32 C 76 56, 70 82, 55 94 C 40 82, 34 56, 34 32 Z" 
          fill="none" stroke="#C68A4C" stroke-width="1.2" stroke-dasharray="2 1"/>

    <!-- Mortarboard Graduation Cap at Crest Top -->
    <polygon points="55,27 71,34 55,41 39,34" fill="#3D2314"/>
    <polygon points="46,38 46,46 55,50 64,46 64,38 55,42" fill="#5A351F"/>
    <!-- Tassel -->
    <path d="M 68 36 C 71 39, 73 45, 73 48" stroke="#C68A4C" stroke-width="1.5" fill="none"/>
    <circle cx="73" cy="49" r="1.5" fill="#8C531B"/>

    <!-- Coffee Cup & Pastry Slice inside Shield -->
    <!-- Coffee Cup -->
    <path d="M 43 57 C 43 68, 55 69, 57 69 C 59 69, 67 68, 67 57 Z" fill="#3D2314"/>
    <path d="M 67 59 C 71 59, 72 64, 67 65" fill="none" stroke="#3D2314" stroke-width="1.5"/>
    <ellipse cx="55" cy="57" rx="12" ry="2.5" fill="#C68A4C"/>
    <!-- Coffee Steam Lines -->
    <path d="M 52 53 C 51 50, 53 49, 52 46" fill="none" stroke="#8C531B" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 58 53 C 59 50, 57 49, 58 46" fill="none" stroke="#8C531B" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Letter 'K' Monogram subtle ribbon -->
    <path d="M 44 76 L 47 76 L 47 88 L 44 88 Z" fill="#8C531B"/>
    <path d="M 47 82 L 54 76 L 58 76 L 50 83 L 59 88 L 54 88 Z" fill="#8C531B"/>

    <!-- Decorative Stars / Wheat Ribbons below shield -->
    <polygon points="55,104 57,108 61,109 58,112 59,116 55,114 51,116 52,112 49,109 53,108" fill="#C68A4C"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 22)">
    <!-- KULMERI -->
    <text x="0" y="40" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="4.5" fill="#2A1810">
      KULMERI
    </text>
    
    <!-- ACADEMIC -->
    <text x="1" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#8C531B">
      ACADEMIC
    </text>

    <!-- Subtitle: BARISTA & PASTRY with accent lines -->
    <line x1="1" y1="78" x2="35" y2="78" stroke="#C68A4C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="44" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#5A351F">
      BARISTA &amp; PASTRY
    </text>
    <line x1="180" y1="78" x2="215" y2="78" stroke="#C68A4C" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
